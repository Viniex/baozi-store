# ===== PERFIL "mysql" =====
# Execute com:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Antes, crie o banco (ou deixe o createDatabaseIfNotExist=true criar sozinho).
spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.h2.console.enabled=false
